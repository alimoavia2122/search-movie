<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16131F">
  <meta name="description" content="Cinefind: search any movie by title and see its poster, rating, release date, genres, cast and full details.">
  <title>Cinefind | Movie Search</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23F4B942'/%3E%3Cpath d='M11 9l12 7-12 7z' fill='%2316131F'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#16131F',
            panel: '#211D2E',
            raised: '#2B2640',
            line: '#3A3452',
            fg: '#ECE7F4',
            mute: '#A59FB8',
            gold: '#F4B942'
          },
          fontFamily: {
            display: ['Fraunces', 'Georgia', 'serif'],
            sans: ['"DM Sans"', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif']
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen bg-ink font-sans text-fg antialiased">
  <a href="#results-section" class="sr-only focus:not-sr-only focus:fixed focus:left-3 focus:top-3 focus:z-50 focus:rounded-lg focus:bg-gold focus:px-4 focus:py-2 focus:font-bold focus:text-ink">Skip to results</a>

  <header class="relative z-20 border-b border-line/70 bg-ink/80 backdrop-blur">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3 sm:px-6">
      <a href="./" class="flex items-center gap-2.5" aria-label="Cinefind home">
        <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-gold text-ink">
          <svg viewBox="0 0 24 24" class="h-4 w-4" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z"/></svg>
        </span>
        <span class="font-display text-xl font-semibold tracking-tight">Cinefind</span>
      </a>
      <a href="https://www.themoviedb.org/" target="_blank" rel="noopener noreferrer" class="text-sm text-mute hover:text-fg">Data from TMDB</a>
    </div>
  </header>

  <section id="hero" class="hero relative overflow-hidden">
    <div class="relative z-10 mx-auto max-w-6xl px-4 pb-10 pt-12 sm:px-6 sm:pb-14 sm:pt-20">
      <h1 class="max-w-2xl font-display text-4xl font-semibold leading-[1.05] tracking-tight sm:text-6xl">Look up any movie.</h1>
      <p class="mt-4 max-w-xl text-base leading-relaxed text-mute sm:text-lg">Type a title to see its poster, rating, release date, genres, cast and the full story.</p>

      <form id="search-form" class="search mt-8 max-w-2xl" role="search" autocomplete="off">
        <label for="search-input" class="sr-only">Search movies by title</label>
        <svg viewBox="0 0 24 24" class="h-5 w-5 shrink-0 text-mute" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search-input" name="q" type="search" placeholder="Search by title, for example Inception" enterkeyhint="search" autocapitalize="off" spellcheck="false">
        <button id="clear-btn" type="button" class="clear-btn" aria-label="Clear search" hidden>
          <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <span class="perf" aria-hidden="true"></span>
        <button type="submit" class="submit-btn">Search</button>
      </form>
    </div>
  </section>

  <main id="results-section" class="mx-auto max-w-6xl px-4 pb-16 pt-8 sm:px-6">
    <div class="mb-5 flex flex-wrap items-baseline justify-between gap-x-4 gap-y-1">
      <h2 id="results-heading" class="font-display text-2xl font-semibold tracking-tight sm:text-3xl">Trending this week</h2>
      <p id="results-count" class="text-sm text-mute" aria-live="polite"></p>
    </div>

    <div id="status" hidden></div>

    <ul id="results" class="grid grid-cols-2 gap-4 sm:grid-cols-3 sm:gap-5 md:grid-cols-4 lg:grid-cols-5" aria-live="polite"></ul>

    <div class="mt-10 flex justify-center">
      <button id="load-more" type="button" class="more-btn" hidden>Show more movies</button>
    </div>

    <noscript><p class="mt-6 rounded-xl border border-line bg-panel p-4 text-mute">Cinefind needs JavaScript turned on to search for movies.</p></noscript>
  </main>

  <footer class="border-t border-line/70">
    <div class="mx-auto max-w-6xl px-4 py-6 text-sm leading-relaxed text-mute sm:px-6">
      <p>Movie data and images come from TMDB. This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
    </div>
  </footer>

  <dialog id="movie-dialog" aria-labelledby="dialog-title">
    <div class="sticky top-0 z-20 flex h-0 justify-end">
      <button id="dialog-close" type="button" class="close-btn" aria-label="Close movie details">
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div id="dialog-body"></div>
  </dialog>

  <script src="js/app.js"></script>
</body>
</html>
